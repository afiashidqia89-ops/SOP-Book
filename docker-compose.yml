services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sop_platform}
      POSTGRES_USER: ${POSTGRES_USER:-sop_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local_password}
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sop_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-change_me_minio}
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio_data:/data"]
  api:
    build: ./apps/api
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-sop_user}:${POSTGRES_PASSWORD:-local_password}@postgres:5432/${POSTGRES_DB:-sop_platform}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-change_me_access}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh}
    ports: ["3001:3001"]
    depends_on:
      postgres:
        condition: service_healthy
  web:
    build: ./apps/web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api/v1}
    ports: ["3000:3000"]
    depends_on: [api]
volumes:
  postgres_data:
  minio_data:
